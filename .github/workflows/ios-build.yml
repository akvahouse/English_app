name: iOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          # Проєкт вимагає SDK iOS 27 (Xcode 27+). Поки GitHub не додав його на раннери,
          # збірку пропускаємо з попередженням, а не падаємо; з'явиться — увімкнеться сама.
          XCODE=$(ls -d /Applications/Xcode_2[7-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "::warning title=Збірку пропущено::На раннері немає Xcode 27+ (є: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' '))"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Check project
        if: steps.xcode.outputs.available == 'true'
        run: xcodebuild -list -project EnglishNotebook.xcodeproj

      - name: Regenerate content (sanity)
        run: |
          cd tools && npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
          cd .. && node tools/export-content.mjs
          git diff --stat -- EnglishNotebook/Resources/Content.json

      - name: Build
        if: steps.xcode.outputs.available == 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -project EnglishNotebook.xcodeproj \
            -scheme EnglishNotebook \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build.log | grep -E "error:|warning:|BUILD|Compiling|^\*\*" || true
          # Статус беремо з логу, а не з grep
          if grep -q "\*\* BUILD SUCCEEDED \*\*" build.log; then echo "OK"; else echo "BUILD FAILED"; exit 1; fi

      - name: Summary
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "Збірку пропущено: на раннері GitHub ще немає Xcode 27 (потрібен SDK iOS 27)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Помилки"
            grep -E "error:" build.log | sort -u || echo "немає"
            echo
            echo "## Попередження"
            grep -E "warning:" build.log | sort -u | head -50 || echo "немає"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
